services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: uvicorn srag.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw
      - ./.cache/duckdb:/home/appuser/.duckdb
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    networks:
      - srag_network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ../SRAGFront
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    profiles:
      - production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - srag_network
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  frontend-dev:
    profiles:
      - dev
    image: node:22-slim
    network_mode: host
    volumes:
      - ../SRAGFront:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

networks:
  srag_network:
    driver: bridge
